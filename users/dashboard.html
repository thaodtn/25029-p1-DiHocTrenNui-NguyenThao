<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://kit.fontawesome.com/d9b040b21a.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/jpg" href="/static/image/icons/logo.jpg">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="../users/dashboard-style.css">
    <link rel="stylesheet" href="/static/css/footer-style.css">
</head>

<body>
    <header id="user-header">
        <div class="left-side-bar">
            <button id="side-bar-menu-btn" class="side-bar-menu-btn"><i class="fa-solid fa-bars fa-xl"></i></button>
        </div>
        <div class="logo-text-container">
            <div class="img-box"><img class="logo-img small-icons" src="/static/image/icons/logo.jpg" alt="logo"></div>
            <p class="logo-text">Đi Học Trên Núi</p>
        </div>
        <div class="right-side-bar">
            <div class="user-search-container">
                <input class="user-search-input" type="text" placeholder="Tìm kiếm...">
                <button class="user-search-btn"><img class="small-icons" src="/static/image/icons/search.png"
                        alt=""></button>
            </div>
            <!-- <div class="img-box notif-btn"><img class="small-icons" src="/static/image/icons/bell.png" alt=""></div> -->
            <!-- <div class="img-box"><img class="avatar-img large-icons" src="/static/image/avatar/user-1.jpg" alt=""></div> -->
            <div id="account-settings-container">
                <button id="account-settings-btn"><img id="account-settings-avatar" class="avatar-img large-icons"
                        src="/static/image/avatar/user-1.jpg" alt=""></button>
                <div id="account-settings-nav" class="account-settings-nav">
                    <div id="profile-setting-btn" onclick="window.location.href ='/users/settings.html'">
                        <img src="/static/image/icons/user.png" alt="">
                        <span>Profile</span>
                    </div>
                    <div id="logout-btn"><img src="/static/image/icons/logout.png" alt="">
                        <span>Logout</span></div>
                </div>
            </div>
        </div>
    </header>

    
    
    <main id="user-dashboard-main-section">
        <section id="left-side-panel" class="left-side-panel">
            <button id="close-left-side-panel-btn" class="close-left-side-panel-btn">x</button>
            <div onclick="window.location.href = '/index.html'">
                <i class="fa-regular fa-house"></i><span>Trang chủ</span>                
            </div>
            <hr>
            <div onclick="window.location.href = '/users/dashboard.html'">
                <img src="/static/image/icons/dashboard.png" alt=""><span>Dash Board</span>
            </div>
            <div id="config-user-btn" onclick="window.location.href = '/management/user-list.html'">
                <img src="/static/image/icons/user-config.png" alt=""><span>Quản lý người dùng</span>
            </div>
            <div id="view-student-btn" onclick="window.location.href = '/management/student-list.html'">
                <img src="/static/image/icons/children (2).png" alt=""><span>Danh sách Học Sinh</span>
            </div>
            <div id="view-sponsor-btn" onclick="window.location.href = '/management/sponsor-list.html'">
                <img src="/static/image/icons/investor.png" alt=""><span>Danh sách Người Hỗ Trợ</span>
            </div>
            <div id="view-school-btn" onclick="window.location.href = '/management/school-list.html'">
                <img src="/static/image/icons/school.png" alt=""><span>Danh sách Trường Học</span>
            </div>
            <div id="view-transaction-record-btn" onclick="window.location.href = '/management/transaction.html'">
                <img src="/static/image/icons/payment.png" alt=""><span>Danh sách Sao kê</span>
            </div>
            <hr>
            <div id="view-report-btn" onclick="window.location.href = '/management/report.html'">
                <i class="fa-solid fa-chart-line"></i><span>Thống kê - Báo cáo</span>
            </div>
        </section>

        <section class="features-container">
            <div class="feature-card" id="students-card">
                <h3>Học sinh</h3>
                <h2 id="my-students"></h2>
                <a href="/management/student-list.html">Xem chi tiết</a>
            </div>
            <div class="feature-card" id="sponsors-card">
                <h3>Người hỗ trợ</h3>
                <h2 id="my-sponsors"></h2>
                <a href="/management/sponsor-list.html">Xem chi tiết</a>
            </div>
            <div class="feature-card" id="schools-card">
                <h3>Trường học</h3>
                <h2 id="my-schools"></h2>
                <a href="/management/school-list.html">Xem chi tiết</a>
            </div>
        </section>

    </main>

    <footer id="dashboard-page-copy-right"></footer>
    <script type="module" src="/static/js/common-script.js"></script>
    <script type="module" src="./dashboard-script.js"></script>
    <script type="module">
        import { initData, fetchAndInjectElementById } from '/static/js/common-script.js';
        import { loadUserHeaderEvents, loadLeftSideBarEvents, loadDatatoDashBoardCard } from '/users/dashboard-script.js';
        initData();
        loadUserHeaderEvents();
        loadLeftSideBarEvents();
        fetchAndInjectElementById('/static/html/footer.html', 'copy-right', 'dashboard-page-copy-right');
        loadDatatoDashBoardCard();
    </script>
</body>

</html>
