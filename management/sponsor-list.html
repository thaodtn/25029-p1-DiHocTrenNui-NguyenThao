<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Người Hỗ Trợ</title>
    <script src="https://kit.fontawesome.com/d9b040b21a.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/jpg" href="/static/image/icons/logo.jpg">
    <link rel="stylesheet" href="/static/css/common-style.css">
    <link rel="stylesheet" href="/static/css/subpage-common-style.css">
    <link rel="stylesheet" href="/users/dashboard-style.css">
    <link rel="stylesheet" href="/management/sponsor-list.css">
    <link rel="stylesheet" href="/static/css/footer-style.css">
</head>
<body>
    <header id="sponsorList-page-header"></header>
    <main id="sponsorList-main-section" class="subpage-main-section">
        <section id="sponsorList-left-side-pannel"></section>
        <section class="subpage-content-section sponsorList-content-section">
            <div class="subpage-title">
                <p>Danh Sách Người Hỗ Trợ</p>
            </div>
            <div class="subpage-action-container">
                <input type="text" id="input-search-text" class="input-search-text" placeholder="Tìm Mã số, Họ Tên, Số điện thoại...">
                <select name="search-sponsor-status" id="search-sponsor-status" class="input-search-filter">
                    <option value="all">Tất cả</option>
                    <option value="inProgress">Đang hỗ trợ</option>                    
                    <option value="gettingInfor">Đang xác minh</option>
                    <option value="gettingConnection">Chờ kết nối HS</option>
                    <option value="ended">Đã kết thúc</option>
                    <option value="canceled">Hủy</option>
                </select>
                <button id="sponsor-search-btn"><i class="fa-solid fa-magnifying-glass fa-lg"></i></button>
                <button id="open-form-add-sponsor-btn"><i class="fa-solid fa-user-plus fa-lg"></i></button>
            </div>
            <div class="subpage-table-container sponsor-table-container">
                <table class="subpage-table">
                    <thead>
                        <tr>
                            <th><div class="inner-cell">Mã Số</div></th>
                            <th><div class="inner-cell">Họ Tên</div></th>
                            <th><div class="inner-cell">Trạng Thái</div></th>
                            <th><div class="inner-cell">Mã HS đang hỗ trợ</div></th>                            
                            <th><div class="inner-cell">Số tiền đã ủng hộ</div></th>
                            <th><div class="inner-cell">Số dư</div></th>
                            <th><div class="inner-cell">Chi tiết</div></th>
                        </tr>
                    </thead>
                    <tbody id="sponsor-table-body">
                    </tbody>
                </table>
            </div>
            
            <section id="add-new-sponsor-modal-container" class="modal-container">
                <form class="add-new-sponsor-form-container" action="">
                    <p class="form-title">Thông tin của Người Hỗ Trợ mới</p>
                    <label for="sponsor-id">Mã Số:</label>
                    <input type="text" name="sponsor-id" id="sponsor-id" required>
                    <label for="sponsor-name">Họ Tên:</label>
                    <input type="text" name="sponsor-name" id="sponsor-name" required>
                    <label for="sponsor-status">Trạng Thái:</label>
                    <select name="sponsor-status" id="sponsor-status" required>
                        <option value="gettingInfor">Đang xác minh</option>
                        <option value="gettingConnection">Chờ kết nối HS</option>
                        <option value="inProgress">Đang hỗ trợ</option>
                    </select>
                    <label for="sponsor-startDate">Ngày Bắt Đầu:</label>
                    <input type="date" name="sponsor-startDate" id="sponsor-startDate" required>
                    <label for="sponsor-contact">Thông tin liên hệ:</label>
                    <input type="text" name="sponsor-contact" id="sponsor-contact" required>

                    <div class="button-group">
                        <button id="add-new-sponsor-btn" class="submit-btn" type="submit"><i
                                class="fa-solid fa-user-plus fa-lg"></i>Thêm</button>
                        <button id="close-add-sponsor-form-btn" type="button"><i
                                class="fa-solid fa-square-xmark fa-lg"></i>Đóng</button>
                    </div>
                </form>
            </section>
        </section>
    </main>
    <footer id="sponsorList-page-copy-right"></footer>

    <script type="module" src="/static/js/common-script.js"></script>
    <script type="module" src="/static/js/mock-data.js"></script>
    <script type="module" src="/users/dashboard-script.js"></script>
    <script type="module" src="/management/sponsor-list.js"></script>
    <script type="module">
        import { users, relatedSponsors, initData, fetchAndInjectElementById } from '/static/js/common-script.js';
        import { loadUserHeaderContent, loadLeftSideBarContent } from '/users/dashboard-script.js';
        import { loadDataToSponsorTable, loadSponsorListEvent } from '/management/sponsor-list.js';
        initData();
        loadUserHeaderContent('/users/dashboard.html', 'user-header', 'sponsorList-page-header');
        loadLeftSideBarContent('sponsorList-left-side-pannel');
        fetchAndInjectElementById('/static/html/footer.html', 'copy-right', 'sponsorList-page-copy-right');
        loadDataToSponsorTable(relatedSponsors);
        loadSponsorListEvent();
    </script>
</body>
</html>
